# Enable Bluetooth
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Split keyboard
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Combos (you use a LOT)
CONFIG_ZMK_COMBO=y
CONFIG_ZMK_COMBO_MAX_COMBOS=90
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=5

# OLED support
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_DISPLAY_WIDGET_BATTERY_STATUS=y

# Power / sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900
